# Core local stack (WU3). Run: make stack-up   (or docker compose --profile core up -d)
# Credentials come from .env, generated by `make env`; there are no defaults.
name: bridgeloan

# Later work units own these fragments; missing files are fine (Compose >= 2.20).
include:
  - path: compose.fetcher.yaml
    required: false
  - path: compose.extractors.yaml
    required: false
  - path: compose.ingest.yaml
    required: false
  - path: compose.api.yaml
    required: false
  - path: compose.gateway.yaml
    required: false
  - path: compose.web.yaml
    required: false

networks:
  core:
    driver: bridge

volumes:
  minio-data:
  postgres-data:

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${POSTGRES_PASSWORD:?run make env}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${POSTGRES_PASSWORD:?run make env}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?run make env}

services:
  minio:
    profiles: [core]
    build: ./minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make env}
      # static KMS key backing SSE-S3 (default bucket encryption)
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?run make env}
      MINIO_BROWSER: "off"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]
    restart: unless-stopped

  postgres:
    profiles: [core]
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_DB: lakekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]
    restart: unless-stopped

  lakekeeper-migrate:
    profiles: [core]
    image: quay.io/lakekeeper/catalog:v0.14.2@sha256:9ad8de17a4d291d355215791ee7410409dcaea83cee04ed9279725b6905a4b85
    command: ["migrate"]
    environment: *lakekeeper-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]
    restart: "no"

  lakekeeper:
    profiles: [core]
    image: quay.io/lakekeeper/catalog:v0.14.2@sha256:9ad8de17a4d291d355215791ee7410409dcaea83cee04ed9279725b6905a4b85
    command: ["serve"]
    environment:
      <<: *lakekeeper-env
    ports:
      - "127.0.0.1:${LAKEKEEPER_PORT:-8181}:8181"
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]
    restart: unless-stopped

  bootstrap:
    profiles: [core]
    build: ./bootstrap
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make env}
      MINIO_ENDPOINT: http://minio:9000
      LAKEKEEPER_URL: http://lakekeeper:8181
      WAREHOUSE_NAME: bridgeloan
    depends_on:
      minio:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    networks: [core]
    restart: "no"
