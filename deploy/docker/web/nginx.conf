# Static SPA + same-origin /api proxy to the gateway. Everything writable lives in /tmp (tmpfs), so the
# container root filesystem can be read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Same policy as the build-time <meta>, plus the directives a meta tag cannot carry.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # v1 limitation (local, single user): the gateway JWT lives in this container's environment, never in the
    # browser bundle. The entrypoint writes it into /tmp/web-upstream.conf; unset means no Authorization header.
    location /api/ {
      include /tmp/web-upstream.conf;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $gateway_upstream;
      proxy_set_header Host $host;
      proxy_set_header Authorization $gateway_authorization;
      proxy_hide_header Server;
      proxy_read_timeout 15s;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      # add_header in a location drops the server-level ones, so repeat the security headers.
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
