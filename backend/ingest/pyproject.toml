[project]
name = "bridge-loan-ingest"
version = "0.1.0"
description = "bridge-loan-tools ingest package"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
# Source-layout skeleton; imported as backend.ingest via the workspace root, not built.
package = false

[dependency-groups]
spark = ["pyspark==4.0.5", "pydantic==2.14.3", "pyyaml==6.0.3"]
pymupdf = ["pymupdf==1.27.2"]
docling = ["docling==2.148.0", "torch==2.15.0", "torchvision==0.29.2"]
unstructured = ["unstructured[pdf]==0.27.36", "torch==2.15.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
