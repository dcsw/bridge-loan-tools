[project]
name = "bridge-loan-tools"
version = "0.1.0"
description = "Bridge loan identification platform (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "pyyaml>=6",
  "ruff>=0.15",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".claude", ".specify", ".beads", "info", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
